<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motion Ad Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">AI MOTION AD WORKFLOW</p>
      <h1>Motion Ad Studio</h1>
    </div>
    <div class="status-pill">10초 · 30초 광고 설계</div>
  </header>

  <main class="workspace">
    <section class="panel input-panel">
      <div class="section-title">
        <h2>광고 기획</h2>
        <button id="presetBtn" class="ghost-btn">창업경진대회 예시 불러오기</button>
      </div>

      <label>광고 목적</label>
      <select id="purpose">
        <option>창업경진대회 발표광고</option>
        <option>퍼스널 브랜딩</option>
        <option>제품/서비스 홍보</option>
      </select>

      <label>영상 길이</label>
      <div class="segmented">
        <button class="duration-btn active" data-duration="10">10초</button>
        <button class="duration-btn" data-duration="30">30초</button>
      </div>

      <label>브랜드명</label>
      <input id="brand" placeholder="예: Algo" />

      <label>핵심 문제</label>
      <textarea id="problem" placeholder="고객이 겪는 문제를 한두 문장으로 입력"></textarea>

      <label>해결책 / 핵심 기능</label>
      <textarea id="solution" placeholder="앱이나 서비스가 어떻게 해결하는지 입력"></textarea>

      <label>타깃</label>
      <input id="target" placeholder="예: 취업 준비 청년, 초기 창업자" />

      <label>핵심 메시지</label>
      <input id="message" placeholder="예: 연결이 기회를 만든다" />

      <label>분위기</label>
      <select id="mood">
        <option>프리미엄 · 세련됨</option>
        <option>빠르고 강렬함</option>
        <option>따뜻하고 공감적</option>
        <option>미래적 · 테크</option>
      </select>

      <div class="toggle-row">
        <div>
          <strong>캐릭터 일관성 잠금</strong>
          <small>업로드한 기준 이미지의 얼굴·의상·정체성을 유지</small>
        </div>
        <input id="characterLock" type="checkbox" checked />
      </div>

      <label>자막 전략</label>
      <select id="subtitleMode">
        <option value="post">후편집용 한글 자막</option>
        <option value="none">영상 생성 단계 무자막</option>
        <option value="placeholder">영문 플레이스홀더</option>
      </select>

      <div class="warning-box">
        <strong>한글 자막 생성 주의</strong>
        <p>생성형 영상에서 한글을 직접 그리면 오타가 발생하기 쉽습니다. 영상은 무자막으로 생성하고 한글은 후편집하는 방식을 권장합니다.</p>
      </div>

      <button id="generateBtn" class="primary-btn">스토리보드 & 프롬프트 생성</button>
    </section>

    <section class="panel output-panel">
      <nav class="tabs">
        <button class="tab active" data-tab="storyboard">스토리보드</button>
        <button class="tab" data-tab="flow">Flow 프롬프트</button>
        <button class="tab" data-tab="subtitle">자막/후편집</button>
      </nav>

      <div id="storyboard" class="tab-content active"></div>
      <div id="flow" class="tab-content"></div>
      <div id="subtitle" class="tab-content"></div>
    </section>
  </main>

  <template id="sceneTemplate">
    <article class="scene-card">
      <div class="scene-head">
        <span class="time-badge"></span>
        <button class="copy-btn">복사</button>
      </div>
      <h3 class="scene-title"></h3>
      <div class="scene-grid">
        <div><span>화면</span><p class="scene-visual"></p></div>
        <div><span>카메라/모션</span><p class="scene-motion"></p></div>
        <div><span>자막</span><p class="scene-subtitle"></p></div>
      </div>
      <div class="prompt-box"><span>생성 프롬프트</span><p class="scene-prompt"></p></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
